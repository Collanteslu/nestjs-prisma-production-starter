name: CI & Typecheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Read-only token for the workflow; cancel superseded runs of the same branch/PR
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Actions pinned by commit SHA (supply chain, item 13); Dependabot keeps them
      # up to date — see .github/dependabot.yml
      - name: 📥 Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # engines.node >=24.9 (ver package.json)
      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠️ Generar Prisma Client
        run: npx prisma generate

      # ALL dependencies (dev included), not only the production subset: dev tooling
      # runs in CI and on developer machines too (item 13)
      - name: 🛡️ Auditoría de dependencias (todas, severidad high+)
        run: npm audit --audit-level=high

      - name: 🗄️ Verificar que las migraciones coinciden con el schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: 🔎 Verificación de tipos
        run: npm run typecheck

      - name: 🏗️ Compilación (Build)
        run: npm run build

      - name: ⚡ Linting & Formatting Check (ESLint)
        run: npm run lint

      - name: 🐳 Construir la imagen Docker
        run: docker build -t nestjs-api:ci .

      # Scan the image built above for HIGH/CRITICAL vulnerabilities with a fix available
      - name: 🔍 Escaneo de la imagen (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Fijado explícito: la versión por defecto de la acción 0.33.1 (v0.65.0) es una
          # tag sin release ni assets y su instalación falla siempre; v0.76.1 verificado
          version: v0.76.1
          image-ref: 'nestjs-api:ci'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      # SBOM de la imagen (CycloneDX) como artefacto del build — decisión de endurecimiento:
      # SBOM sí (barato y ya generado aquí); firma con cosign queda pendiente de publicar la
      # imagen en un registro (la CI solo construye, nunca empuja — ver AGENTS.md)
      - name: 🧾 SBOM de la imagen (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: 'nestjs-api:ci'
          format: 'cyclonedx'
          output: 'sbom.cdx.json'
          exit-code: '0'

      - name: 📦 Publicar el SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-nestjs-api
          path: sbom.cdx.json
          retention-days: 30
          if-no-files-found: error

      # Los tests crean y migran su propia base de datos SQLite temporal
      # (test/setup-env.ts + el beforeAll de test/app.spec.ts), así que dev.db no se toca.
      # Incluye los suelos de cobertura de las rutas críticas (jest.config.js).
      - name: 🧪 Ejecutar Tests Automatizados con cobertura (Jest)
        run: npm run test:cov

  # Executable contract vs the reference behaviour, in every AUTH_MODE (item 14).
  # Each matrix leg boots a fresh, migrated SQLite database, starts the server and runs
  # the groups applicable to its mode; `recovery` gets its SMTP sink from the runner.
  contract-parity:
    name: Contrato (AUTH_MODE=${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [none, basic, full]

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠️ Generar Prisma Client
        run: npx prisma generate

      - name: 🏗️ Compilación (Build)
        run: npm run build

      - name: 🗄️ Migrar la base de datos temporal del contrato
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./contract-ci.db

      - name: 🚀 Arrancar el servidor (AUTH_MODE=${{ matrix.mode }})
        run: |
          nohup env PORT=3011 \
            AUTH_MODE=${{ matrix.mode }} \
            DATABASE_URL=file:./contract-ci.db \
            JWT_SECRET=contract-ci-secret-0123456789abcdef0123456789 \
            JWT_REFRESH_SECRET=contract-ci-refresh-abcdef0123456789abcdef01 \
            MAIL_TRANSPORT=smtp SMTP_URL=smtp://127.0.0.1:2525 \
            MAIL_FROM="Contract <no-reply@localhost>" \
            APP_URL=http://127.0.0.1:3011 \
            node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3011/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "El servidor no arrancó:"
          tail -50 server.log
          exit 1

      - name: 🧪 Ejecutar el contrato de paridad
        run: node contract/run.mjs --base http://127.0.0.1:3011 --mode ${{ matrix.mode }} --db "$PWD/contract-ci.db"

      - name: 📋 Log del servidor
        if: failure()
        run: tail -80 server.log || true
